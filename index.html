<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dados de Arkham</title>
  <meta name="description" content="Rolador de dados 3D para RPG, à luz de velas: d4, d6, d8, d10, d12, d20 e d100.">
  <meta name="theme-color" content="#060807">

  <!-- instalar como app na tela inicial (Android e iPhone) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arkham">
  <script>
    // No endereço de teste o app ganha outro nome e outra identidade, para nunca se misturar com o
    // app oficial que os amigos instalaram na tela inicial.
    (() => {
      const teste = location.pathname.toLowerCase().startsWith('/dados-de-arkham-teste/');
      document.documentElement.dataset.place = teste ? 'teste' : location.hostname === 'localhost' ? 'local' : 'oficial';
      if (!teste) return;
      document.querySelector('link[rel="manifest"]').href = 'manifest-teste.webmanifest';
      document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'Arkham Teste';
    })();
  </script>

  <!-- prévia do link ao compartilhar (WhatsApp e afins) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Dados de Arkham">
  <meta property="og:description" content="Rolador de dados 3D para RPG, à luz de velas.">
  <meta property="og:image" content="https://webersoncosta.github.io/Dados-de-Arkham/icons/icon-512.png">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="src/app.css">
</head>
<body>
  <canvas id="scene" aria-label="Mesa com dados"></canvas>
  <div class="vignette"></div>

  <header class="hud-top" id="hudTop">
    <div class="brand">
      <h1 id="appTitle">Dados de Arkham</h1>
      <p id="subtitle">&nbsp;</p>
    </div>
    <div class="toggles">
      <button id="btnSfx" class="toggle" type="button" aria-pressed="true">Som</button>
      <button id="btnAmb" class="toggle" type="button" aria-pressed="true">Ambiente</button>
    </div>
  </header>

  <div class="verdict" id="verdict" hidden aria-live="polite">
    <p class="verdict-label" id="vLabel"></p>
    <p class="verdict-num" id="vNum"></p>
    <p class="verdict-parts" id="vParts"></p>
    <p class="verdict-note" id="vNote" hidden></p>
  </div>

  <footer class="hud-bottom" id="hudBottom">
    <p class="hint" id="hint">Preparando a mesa…</p>
    <div class="slot">
      <div class="modes" id="modes" role="group"></div>
      <div class="compose is-off" id="compose" role="group" aria-label="Montar a rolagem">
        <div class="mode-group">
          <span class="mode-caption">atalhos</span>
          <div class="mode-buttons"><button type="button" class="mode-chip" id="btnShortcuts" aria-label="Atalhos e fórmulas salvas">★</button></div>
        </div>
        <div class="mode-group formula-group">
          <span class="mode-caption">fórmula</span>
          <div class="formula">
            <span id="formulaText" aria-live="polite"></span>
            <button type="button" id="btnClear" aria-label="Limpar e voltar a um dado só">×</button>
          </div>
        </div>
        <div class="mode-group">
          <span class="mode-caption">número fixo</span>
          <div class="mode-buttons">
            <button type="button" class="mode-chip" id="btnMinus" aria-label="Diminuir o número fixo">−</button>
            <button type="button" class="mode-chip" id="btnPlus" aria-label="Aumentar o número fixo">+</button>
          </div>
        </div>
      </div>
    </div>
    <nav class="tray" id="tray" aria-label="Escolha os dados"></nav>
  </footer>
  <p class="version" id="version"></p>

  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="presetsHead">
    <div class="sheet-card">
      <div class="sheet-head">
        <p class="sheet-title" id="presetsHead">Atalhos</p>
        <button type="button" class="toggle" id="btnCloseSheet">Fechar</button>
      </div>
      <p class="sheet-label" id="presetsTitle">Prontos</p>
      <div class="sheet-grid" id="presets"></div>
      <p class="sheet-label">Minhas fórmulas</p>
      <div class="sheet-grid" id="favorites"></div>
      <p class="sheet-empty" id="favoritesEmpty">Nenhuma ainda. Monte uma fórmula e salve aqui.</p>
      <button type="button" class="sheet-save" id="btnSave"></button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
